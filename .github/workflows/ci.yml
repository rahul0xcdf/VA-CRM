# CI harness — specs/phase-0-foundations.md §2.5.
# windows-latest is required: VinayakaAgencies.App targets net8.0-windows with UseWPF, which
# cannot build on Linux/macOS runners.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Build & test
        shell: pwsh
        run: .\build.ps1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
